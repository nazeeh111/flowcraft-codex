<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="390" viewBox="0 0 1100 390"><title>Scientific figure demonstration</title><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#34465a"/></marker></defs><path id="edge-forward-0" d="M210 135 H260" stroke="#34465a" stroke-width="2"  fill="none" marker-end="url(#arrow)"/><path id="edge-forward-1" d="M440 135 H490" stroke="#34465a" stroke-width="2"  fill="none" marker-end="url(#arrow)"/><path id="edge-forward-2" d="M670 135 H720" stroke="#34465a" stroke-width="2"  fill="none" marker-end="url(#arrow)"/><path id="edge-prediction-loss" d="M840 185 V250" stroke="#34465a" stroke-width="2"  fill="none" marker-end="url(#arrow)"/><path id="edge-label-loss" d="M1015 287 H930" stroke="#34465a" stroke-width="2"  fill="none" marker-end="url(#arrow)"/><path id="edge-update-encoder" d="M750 287 H350 V187" stroke="#34465a" stroke-width="2" stroke-dasharray="6 5" fill="none" marker-end="url(#arrow)"/><path id="edge-update-classifier" d="M930 267 H960 V210 H875 V187" stroke="#34465a" stroke-width="2" stroke-dasharray="6 5" fill="none" marker-end="url(#arrow)"/><g id="module-input"><title>Input</title><rect x="30" y="85" width="180" height="100" rx="10" fill="#edf2f7" stroke="#6c7b8b" stroke-width="1.5"/><text x="120" y="125" text-anchor="middle" font-family="Helvetica" font-size="20" fill="#17212e">Input</text><text x="120" y="155" text-anchor="middle" font-family="Helvetica" font-size="15" fill="#17212e">Observed sequence</text></g><g id="module-encoder"><title>Encoder</title><rect x="260" y="85" width="180" height="100" rx="10" fill="#e4f0fc" stroke="#6c7b8b" stroke-width="1.5"/><text x="350" y="125" text-anchor="middle" font-family="Helvetica" font-size="20" fill="#17212e">Encoder</text><text x="350" y="155" text-anchor="middle" font-family="Helvetica" font-size="15" fill="#17212e">Shared features</text></g><g id="module-pool"><title>Pooling</title><rect x="490" y="85" width="180" height="100" rx="10" fill="#e7f3ed" stroke="#6c7b8b" stroke-width="1.5"/><text x="580" y="125" text-anchor="middle" font-family="Helvetica" font-size="20" fill="#17212e">Pooling</text><text x="580" y="155" text-anchor="middle" font-family="Helvetica" font-size="15" fill="#17212e">Token mean</text></g><g id="module-classifier"><title>Classifier</title><rect x="720" y="85" width="180" height="100" rx="10" fill="#f1eaf8" stroke="#6c7b8b" stroke-width="1.5"/><text x="810" y="125" text-anchor="middle" font-family="Helvetica" font-size="20" fill="#17212e">Classifier</text><text x="810" y="155" text-anchor="middle" font-family="Helvetica" font-size="15" fill="#17212e">Predicted label</text></g><g id="module-loss"><title>Training loss</title><rect x="750" y="250" width="180" height="75" rx="10" fill="#fcf0dc" stroke="#6c7b8b"/><text x="840" y="282" text-anchor="middle" font-family="Helvetica" font-size="18" fill="#17212e">Training loss</text><text x="840" y="307" text-anchor="middle" font-family="Helvetica" font-size="14" fill="#17212e">Training only</text></g><text x="1020" y="270" text-anchor="middle" font-family="Helvetica" font-size="16" fill="#17212e">True label</text><text x="450" y="350" text-anchor="middle" font-family="Helvetica" font-size="16" fill="#17212e">Dashed: parameter updates during training only</text></svg>