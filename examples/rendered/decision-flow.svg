<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="410" viewBox="0 0 1120 410"><title>Sensor classification and manual review</title><desc>Valid sensor readings feed a feature extractor and classifier. Invalid readings and predictions below a confidence threshold go to manual review. Predictions meeting the threshold emit their label.</desc><rect width="1120" height="410" fill="white"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#252525"/></marker></defs><path id="edge-readings-validation" d="M160 130 H200" fill="none" stroke="#252525" stroke-width="2" marker-end="url(#arrow)"/><path id="edge-valid-features" d="M340 130 H380" fill="none" stroke="#252525" stroke-width="2" marker-end="url(#arrow)"/><path id="edge-features-classifier" d="M520 130 H560" fill="none" stroke="#252525" stroke-width="2" marker-end="url(#arrow)"/><path id="edge-classifier-confidence" d="M700 130 H740" fill="none" stroke="#252525" stroke-width="2" marker-end="url(#arrow)"/><path id="edge-confident-output" d="M900 130 H940" fill="none" stroke="#252525" stroke-width="2" marker-end="url(#arrow)"/><path id="edge-invalid-review" d="M270 175 V340 H560" fill="none" stroke="#252525" stroke-width="2" marker-end="url(#arrow)"/><path id="edge-low-confidence-review" d="M820 190 V340 H750" fill="none" stroke="#252525" stroke-width="2" marker-end="url(#arrow)"/><g id="module-readings"><title>readings</title><rect x="20" y="85" width="140" height="90" rx="9" fill="#f5f5f5" stroke="#303030" stroke-width="1.8"/><text x="90.0" y="124.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#202020">Sensor</text><text x="90.0" y="148.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#202020">readings</text></g><g id="module-validation"><title>validation</title><rect x="200" y="85" width="140" height="90" rx="9" fill="#f5f5f5" stroke="#303030" stroke-width="1.8"/><text x="270.0" y="124.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#202020">Validate</text><text x="270.0" y="148.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#202020">readings</text></g><g id="module-features"><title>features</title><rect x="380" y="85" width="140" height="90" rx="9" fill="#f5f5f5" stroke="#303030" stroke-width="1.8"/><text x="450.0" y="124.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#202020">Feature</text><text x="450.0" y="148.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#202020">extractor</text></g><g id="module-classifier"><title>classifier</title><rect x="560" y="85" width="140" height="90" rx="9" fill="#f5f5f5" stroke="#303030" stroke-width="1.8"/><text x="630.0" y="136.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#202020">Classifier</text></g><g id="module-output"><title>output</title><rect x="940" y="85" width="140" height="90" rx="9" fill="#f5f5f5" stroke="#303030" stroke-width="1.8"/><text x="1010.0" y="124.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#202020">Emit predicted</text><text x="1010.0" y="148.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#202020">label</text></g><g id="module-confidence"><title>Confidence threshold decision</title><path d="M740 130 L820 70 L900 130 L820 190 Z" fill="#f5f5f5" stroke="#303030" stroke-width="1.8"/><text x="820" y="122" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#202020">Confidence</text><text x="820" y="145" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#202020">≥ threshold?</text></g><g id="module-review"><title>review</title><rect x="560" y="300" width="190" height="80" rx="9" fill="#f5f5f5" stroke="#303030" stroke-width="1.8"/><text x="655.0" y="346.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#202020">Manual review</text></g><text x="360" y="109" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#202020">Valid</text><text x="304" y="245" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#202020">Invalid</text><text x="919" y="109" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#202020">Yes</text><text x="874" y="245" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#202020">No: below</text><text x="874" y="265" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#202020">threshold</text></svg>