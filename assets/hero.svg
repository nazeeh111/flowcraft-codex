<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800"><title>Flowcraft: make the idea clear</title><desc>A Codex skill for source-grounded editable diagrams with a render and review loop.</desc><rect width="1600" height="800" rx="28" fill="#101923"/><path d="M80 86H1520" stroke="#2c3946"/><text x="80" y="62" font-family="Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#b9c9d6" letter-spacing="5">FLOWCRAFT</text><text x="1245" y="62" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#9caebb" letter-spacing="2">A CODEX SKILL</text><text x="80" y="200" font-family="Helvetica, Arial, sans-serif" font-size="76" font-weight="700" fill="#eef3f7">Make the idea</text><text x="80" y="288" font-family="Helvetica, Arial, sans-serif" font-size="96" font-weight="700" fill="#B5A7FF">clear.</text><text x="84" y="353" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#b9c9d6">Diagrams that explain.</text><text x="84" y="393" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#b9c9d6">Figures you can keep editing.</text><circle cx="93" cy="493" r="6" fill="#8ad2bc"/><text x="115" y="500" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#edf3f6" letter-spacing="1.6">SOURCE FIRST</text><text x="115" y="524" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#9cafbd">Faithful to the facts</text><circle cx="93" cy="562" r="6" fill="#8ad2bc"/><text x="115" y="569" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#edf3f6" letter-spacing="1.6">EDITABLE</text><text x="115" y="593" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#9cafbd">Real SVG objects</text><circle cx="93" cy="631" r="6" fill="#8ad2bc"/><text x="115" y="638" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#edf3f6" letter-spacing="1.6">CHECKED</text><text x="115" y="662" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#9cafbd">Render. Inspect. Refine.</text><rect x="765" y="160" width="755" height="515" rx="22" fill="#16222e" stroke="#344352"/><text x="810" y="212" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#9cafbd" letter-spacing="1.3">FROM SOURCE TO SOMETHING CLEAR</text><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#8fa8b8"/></marker></defs><path d="M1000 322H1060" stroke="#8fa8b8" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M1240 322H1300" stroke="#8fa8b8" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M1390 367V465H1150V533" stroke="#8fa8b8" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M1060 568H910V369" stroke="#8fa8b8" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="820" y="275" width="180" height="92" rx="12" fill="#283e4d" stroke="#657584"/><text x="842" y="311" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#eef3f7">Ground</text><text x="842" y="340" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#c3cfda">Source + intent</text><rect x="1060" y="275" width="180" height="92" rx="12" fill="#30304C" stroke="#657584"/><text x="1082" y="311" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#eef3f7">Compose</text><text x="1082" y="340" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#c3cfda">Editable objects</text><rect x="1300" y="275" width="180" height="92" rx="12" fill="#263f3d" stroke="#657584"/><text x="1322" y="311" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#eef3f7">Render</text><text x="1322" y="340" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#c3cfda">Fresh output</text><rect x="1060" y="530" width="180" height="92" rx="12" fill="#2e3349" stroke="#657584"/><text x="1082" y="566" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#eef3f7">Refine</text><text x="1082" y="595" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#c3cfda">Inspect + repair</text><text x="970" y="438" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#b9c9d6">Check meaning,</text><text x="970" y="466" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#b9c9d6">not just pixels.</text><text x="80" y="750" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#91a7b6" letter-spacing="2">SVG  /  PNG  /  PDF</text><text x="1080" y="750" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#91a7b6" letter-spacing="1.2">YOUR MODEL. YOUR TOOLS.</text></svg>